<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Smart Dairy Farm Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0d9488 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .register-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .register-header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      padding: 30px 28px 24px;
      text-align: center;
    }
    .register-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 10px;
      backdrop-filter: blur(5px);
    }
    .register-body {
      padding: 28px;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="register-header">
      <div class="register-icon-box">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h4 class="fw-bold mb-1">Create Farm Account</h4>
      <p class="mb-0 text-white-50 small">Join Smart Dairy Farm Management System</p>
    </div>

    <div class="register-body">
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show py-2 px-3 small" role="alert">
              {{ message }}
              <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small">Full Name *</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
              <input type="text" name="full_name" class="form-control" placeholder="e.g. Ramesh Patel" required autofocus>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small">Username *</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
              <input type="text" name="username" class="form-control" placeholder="e.g. ramesh" required>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-7">
            <label class="form-label fw-semibold text-muted small">Email Address *</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control" placeholder="ramesh@dairy.com" required>
            </div>
          </div>
          <div class="col-md-5">
            <label class="form-label fw-semibold text-muted small">Role *</label>
            <select name="role" class="form-select" required>
              <option value="manager" selected>Farm Manager</option>
              <option value="staff">Farm Staff</option>
              <option value="admin">Administrator</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small">Password *</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small">Confirm Password *</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-shield-halved text-muted"></i></span>
              <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required minlength="6">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-custom-primary w-100 py-2 fs-6">
          <i class="fa-solid fa-user-check me-2"></i> Register & Enter Dashboard
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <span class="text-muted small">Already have an account?</span>
        <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary text-decoration-none ms-1">
          Sign In here
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends "layout.html" %}

{% block title %}Account Profile - Smart Dairy Farm{% endblock %}
{% block page_title %}User Profile Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="content-card">
      <div class="content-card-header">
        <h5 class="content-card-title"><i class="fa-solid fa-user-gear text-primary"></i> Account Settings</h5>
      </div>
      <div class="content-card-body">
        <form method="POST" action="{{ url_for('auth.profile') }}">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" value="{{ user.username }}" disabled readonly>
              <div class="form-text">Username cannot be changed.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Role</label>
              <input type="text" class="form-control text-capitalize" value="{{ user.role }}" disabled readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name *</label>
              <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address *</label>
              <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
          </div>

          <h6 class="fw-bold border-bottom pb-2 mb-3 text-secondary">Change Password <span class="fw-normal text-muted small">(leave blank to keep current)</span></h6>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" name="new_password" class="form-control" placeholder="Min. 6 characters">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-custom-primary">
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
